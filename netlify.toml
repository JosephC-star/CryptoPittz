[context.production.environment]
  VITE_OOX_PREVIEW = "true"
  VITE_OOX_TRANSACTIONS = "true"

[context."feature/oox-purchase-preview".environment]
  VITE_OOX_PREVIEW = "true"
  VITE_OOX_TRANSACTIONS = "true"

[context.deploy-preview]
  command = 'if [ "$HEAD" = "feature/oox-purchase-preview" ] || [ "$HEAD" = "feature/xoxno-purchases" ]; then VITE_OOX_PREVIEW=true VITE_OOX_TRANSACTIONS=true npm run build; else VITE_OOX_TRANSACTIONS=false npm run build; fi'

[context.deploy-preview.environment]
  VITE_OOX_PREVIEW = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self'"

[[redirects]]
  from = "/bonez-swap"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/bonez-swap/"
  to = "/index.html"
  status = 200
  force = true

